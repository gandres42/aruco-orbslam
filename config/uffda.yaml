%YAML:1.0

# SLAM NODE -------------------------------------------------------------------
# ORBSLAM vocab file
ORB.vocabulary: "/usr/local/share/ORB_SLAM3/Vocabulary/ORBvoc.txt"

# Video topics
Topics.video: "/BlueROV2/video"
Topics.annotated: "/aruco/annotated"
Topics.trajectory: "/aruco/path"
Topics.pointcloud: "/aruco/pointcloud"
Topics.scale: "/aruco/scale"
Topics.frameId: "map"

# std_srvs/Trigger services that re-collect the anchor and restart scale estimation
Services.reanchor: "/aruco/reanchor"
Services.rescale: "/aruco/rescale"

# ARUCO TAGS ------------------------------------------------------------------
# Aruco dictionary
Aruco.dictionary: "DICT_6X6_50"

# Tag sizes
Aruco.tags:
  - { id: 14, size: 0.15 }
  - { id: 12, size: 0.20 }
  - { id: 7, size: 0.10 }
  - { id: 15, size: 0.15 }
  - { id: 16, size: 0.075 }
  - { id: 17, size: 0.075 }
  - { id: 18, size: 0.05 }

# ARUCO ANCHOR ----------------------------------------------------------------
# anchor tag id (must be listed in Aruco.tags, remove or set negative to disable)
Anchor.id: 14

# the anchor pose is averaged over the most recent Anchor.history sightings (one per
# tracked frame), path and map are published once there are Anchor.observations
Anchor.observations: 45
Anchor.history: 1000

# pose of the anchor tag's center in the published frame
Anchor.px: 0.0
Anchor.py: -0.4
Anchor.pz: 0.3
Anchor.rx: 0.0
Anchor.ry: 0.0
Anchor.rz: 0.0

# SCALE RECOVERY --------------------------------------------------------------
# scale is the median of the most recent Scale.history samples (one per tracked frame
# with tracked features on a known tag)
Scale.history: 1000

# Required keyframe observations before a point is published
PointCloud.minObservations: 10

# how often (Hz) the whole pointcloud is republished
PointCloud.rate: 24.0

# ORBSLAM ---------------------------------------------------------------------
# Camera model
Camera.type: "PinHole"

# Downsampling ratio for SLAM-only use
Camera.imageScale: 0.5

# Camera calibration and distortion
Camera.fx: 1078.17559
Camera.fy: 1076.46176
Camera.cx: 1010.57086
Camera.cy: 463.06243

Camera.k1: 0.019645
Camera.k2: 0.007271
Camera.p1: -0.004324
Camera.p2: -0.001628
Camera.k3: 0.0

# Camera FPS
Camera.fps: 24.0

# Video format (0 for BGR, 1 for RGB)
Camera.RGB: 0

# ORB extractor
ORBextractor.nFeatures: 2000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 12
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 12

# Viewer (only used when Viewer.UseViewer is True)
Viewer.UseViewer: False
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500
