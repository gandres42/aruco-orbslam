%YAML:1.0

# SLAM NODE -------------------------------------------------------------------
# ORBSLAM vocab file
ORB.vocabulary: "/usr/local/share/ORB_SLAM3/Vocabulary/ORBvoc.txt"

# Video topics
Topics.video: "/BlueROV2/video"
Topics.annotated: "/aruco/annotated"
Topics.trajectory: "/reference_trajectory"
Topics.frameId: "map"

# ARUCO TAGS ------------------------------------------------------------------
# Aruco dictionary
Aruco.dictionary: "DICT_6X6_50"

# Tag sizes
Aruco.tags:
  - { id: 14, size: 0.15 }
  - { id: 12, size: 0.20 }
  - { id: 7, size: 0.10 }
  - { id: 15, size: 0.15 }
  - { id: 16, size: 0.075 }
  - { id: 17, size: 0.075 }
  - { id: 18, size: 0.05 }

# number of frames averaged for the rolling scale estimate
Scale.windowSize: 50

# Camera body rotation
Correction.roll: 0.0
Correction.pitch: 8.0
Correction.yaw: 0.0

# ORBSLAM ---------------------------------------------------------------------
# Camera model (required by ORB-SLAM3)
Camera.type: "PinHole"

# Image size (required by the ORB-SLAM3 viewer)
Camera.width: 1920
Camera.height: 1080

# Camera calibration and distortion
Camera.fx: 1078.17559
Camera.fy: 1076.46176
Camera.cx: 1010.57086
Camera.cy: 463.06243

Camera.k1: 0.019645
Camera.k2: 0.007271
Camera.p1: -0.004324
Camera.p2: -0.001628
Camera.k3: 0.0

# Camera FPS
Camera.fps: 24.0

# Video format (0 for BGR, 1 for RGB)
Camera.RGB: 0

# ORB extractor
ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 8

# Viewer (only used when Viewer.UseViewer is True)
Viewer.UseViewer: True
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500
